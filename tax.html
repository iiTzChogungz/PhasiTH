<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>คำนวณภาษีเงินได้บุคคลธรรมดา | เครื่องมือเงินไทย</title><meta name="description" content="คำนวณภาษีเงินได้บุคคลธรรมดาจากเงินเดือน ตามขั้นบันไดล่าสุด">
<link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="calc.js"></script>
<script>if(CONFIG.adsenseClient){var s=document.createElement('script');s.async=1;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+CONFIG.adsenseClient;document.head.appendChild(s)}</script></head>
<body><header><a href="index.html">💰 เครื่องมือเงินไทย</a></header><main>
<h1>คำนวณภาษีเงินได้บุคคลธรรมดา</h1><div class="card"><label>เงินเดือนต่อเดือน (บาท)</label><input id="s" type="number" value="40000"><label>ค่าลดหย่อนอื่นๆ ต่อปี (ประกัน กองทุน ฯลฯ)</label><input id="o" type="number" value="0"><button id="b">คำนวณ</button><div class="res" id="r"></div></div><div class="card"><h2>อัตราภาษีขั้นบันได</h2><table><tr><th>เงินได้สุทธิถึง</th><th>อัตรา</th></tr><tbody id="t"></tbody></table></div>
<p class="mut">ผลลัพธ์เป็นการประมาณเพื่อประกอบการวางแผน ไม่ใช่คำปรึกษาทางภาษี/การเงิน</p></main>
<footer class="mut">© เครื่องมือเงินไทย · <a href="privacy.html">นโยบายความเป็นส่วนตัว</a></footer>
<script>const f=n=>n.toLocaleString("th-TH",{maximumFractionDigits:2});
document.getElementById('t').innerHTML=CONFIG.brackets.map(([c,r])=>'<tr><td>'+(c===Infinity?'มากกว่า 5,000,000':f(c))+'</td><td>'+(r*100)+'%</td></tr>').join('');
b.onclick=()=>{const a=Calc.annualTax(+s.value,+o.value);r.innerHTML='เงินได้ต่อปี <b>'+f(a.gross)+'</b><br>เงินได้สุทธิ <b>'+f(a.net)+'</b><br>ภาษีที่ต้องจ่ายต่อปี <b>'+f(a.tax)+'</b> บาท';};b.click();</script></body></html>
