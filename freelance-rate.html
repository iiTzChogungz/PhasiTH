<script>const f=n=>n.toLocaleString("th-TH",{maximumFractionDigits:2});btn.onclick=()=>{const q=Calc.freelanceRate(+t.value,+h.value,+document.getElementById('x').value,+w.value);r.innerHTML='ควรตั้งราคา <b>'+f(q.perHour)+'</b> บาท/ชั่วโมง<br>ยอดรวมที่ต้องออกบิล <b>'+f(q.perMonth)+'</b> บาท/เดือน';};btn.click();</script></body></html>
