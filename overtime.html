<body><header><a href="index.html">💰 เครื่องมือเงินไทย</a></header><main>
<h1>คำนวณค่าล่วงเวลา (OT)</h1><div class="card"><label>เงินเดือน (บาท)</label><input id="m" type="number" value="20000" ><label>ชั่วโมง OT</label><input id="hr" type="number" value="10" ><label>ตัวคูณ (เช่น 1.5 วันทำงานปกติ)</label><input id="k" type="number" value="1.5" step="0.5"><p class="mut">ตัวคูณตามกฎหมายแรงงานขึ้นกับประเภทวันและลูกจ้าง ตรวจสอบกับกรมสวัสดิการและคุ้มครองแรงงาน</p><button id="btn">คำนวณ</button><div class="res" id="r"></div></div>
<p class="mut">ผลลัพธ์เป็นการประมาณเพื่อประกอบการวางแผน ไม่ใช่คำปรึกษาทางภาษี/การเงิน</p><div id="aff"></div><script src="config.js"></script><script src="affiliate.js"></script></main>

<script>const f=n=>n.toLocaleString("th-TH",{maximumFractionDigits:2});btn.onclick=()=>{const x=Calc.overtime(+m.value,+hr.value,+k.value);r.innerHTML='ค่าจ้างต่อชั่วโมง <b>'+f(x.hourly)+'</b><br>ค่า OT <b>'+f(x.pay)+'</b> บาท';};btn.click();</script></body></html>
