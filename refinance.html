<body><header><a href="index.html">💰 เครื่องมือเงินไทย</a></header><main>
<h1>รีไฟแนนซ์บ้าน คุ้มไหม</h1><div class="card"><label>ยอดหนี้คงเหลือ (บาท)</label><input id="b" type="number" value="2000000" ><label>ดอกเบี้ยเดิม (%)</label><input id="o" type="number" value="6.5" step="0.1"><label>ดอกเบี้ยใหม่ (%)</label><input id="n" type="number" value="4.5" step="0.1"><label>ระยะเวลาที่เหลือ (ปี)</label><input id="y" type="number" value="20" ><label>ค่าธรรมเนียมรวม (จดจำนอง ประเมิน ฯลฯ) บาท</label><input id="fee" type="number" value="20000" ><button id="btn">คำนวณ</button><div class="res" id="r"></div></div>
<p class="mut">ผลลัพธ์เป็นการประมาณเพื่อประกอบการวางแผน ไม่ใช่คำปรึกษาทางภาษี/การเงิน</p><div id="aff"></div><script src="config.js"></script><script src="affiliate.js"></script></main>

<script>const f=n=>n.toLocaleString("th-TH",{maximumFractionDigits:2});btn.onclick=()=>{const x=Calc.refinance(+b.value,+o.value,+n.value,+y.value,+fee.value);r.innerHTML='ค่างวดเดิม <b>'+f(x.oldPay)+'</b><br>ค่างวดใหม่ <b>'+f(x.newPay)+'</b><br>ประหยัดต่อเดือน <b>'+f(x.saveMonth)+'</b><br>ประหยัดรวมหลังหักค่าธรรมเนียม <b>'+f(x.saveTotal)+'</b> บาท'+(x.saveTotal<=0?'<br>⚠️ ไม่คุ้มตามตัวเลขนี้':'');};btn.click();</script></body></html>
