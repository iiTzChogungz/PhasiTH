<body><header><a href="index.html">💰 เครื่องมือเงินไทย</a></header><main>
<h1>ลดหย่อนเพิ่ม ประหยัดภาษีได้เท่าไร</h1><div class="card"><label>เงินเดือนต่อเดือน (บาท)</label><input id="s" type="number" value="60000" ><label>ยอดลดหย่อนเพิ่มต่อปี (บาท)</label><input id="e" type="number" value="50000" ><p class="mut">เครื่องมือนี้ไม่ตรวจเพดานลดหย่อนแต่ละประเภท ตรวจเพดานกับกรมสรรพากรก่อนซื้อ</p><button id="btn">คำนวณ</button><div class="res" id="r"></div></div>
<p class="mut">ผลลัพธ์เป็นการประมาณเพื่อประกอบการวางแผน ไม่ใช่คำปรึกษาทางภาษี/การเงิน</p></main>

<script>const f=n=>n.toLocaleString("th-TH",{maximumFractionDigits:2});btn.onclick=()=>{const x=Calc.taxSaved(+s.value,+e.value);r.innerHTML='ภาษีก่อน <b>'+f(x.before)+'</b><br>ภาษีหลัง <b>'+f(x.after)+'</b><br>ประหยัด <b>'+f(x.saved)+'</b> บาท/ปี';};btn.click();</script></body></html>
