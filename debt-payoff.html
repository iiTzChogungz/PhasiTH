<script>const f=n=>n.toLocaleString("th-TH",{maximumFractionDigits:2});btn.onclick=()=>{const x=Calc.debtMonths(+d.value,+i.value,+p.value);r.innerHTML=x.months===Infinity?'⚠️ ยอดจ่ายไม่พอแม้แต่ดอกเบี้ย หนี้จะไม่ลดลง':'หมดหนี้ใน <b>'+x.months+'</b> เดือน (~'+(x.months/12).toFixed(1)+' ปี)<br>ดอกเบี้ยรวม <b>'+f(x.interest)+'</b> บาท';};btn.click();</script></body></html>
